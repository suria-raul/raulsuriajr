<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Milky Way Galaxy - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Three.js from official CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    let scene, camera, renderer, galaxy;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 100;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      galaxy = createGalaxy();
      scene.add(galaxy);

      window.addEventListener('resize', onWindowResize, false);
    }

    function createGalaxy() {
      const numStars = 10000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(numStars * 3);

      const arms = 4;
      const armSeparation = (2 * Math.PI) / arms;
      const spread = 30;
      const radius = 80;

      for (let i = 0; i < numStars; i++) {
        const r = Math.random() * radius;
        const arm = i % arms;
        const angle = r * 0.3 + arm * armSeparation;

        const x = Math.cos(angle) * r + (Math.random() - 0.5) * spread;
        const y = (Math.random() - 0.5) * spread * 0.5;
        const z = Math.sin(angle) * r + (Math.random() - 0.5) * spread;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.5,
        transparent: true,
        opacity: 0.8,
        sizeAttenuation: true,
      });

      return new THREE.Points(geometry, material);
    }

    function animate() {
      requestAnimationFrame(animate);
      galaxy.rotation.y += 0.0008;
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
