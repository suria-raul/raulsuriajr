<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glimmering Spikey Clouds</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* Dark background for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        /* Removed h1 styling as the h1 tag will be removed */
        canvas {
            display: block;
            /* Removed border and box-shadow for glowing effect */
            border-radius: 0; /* Remove border-radius to occupy full screen edges */
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.9em;
            text-align: center;
            background-color: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 10; /* Ensure info text is above canvas */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #info {
                font-size: 0.8em;
                padding: 5px 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Removed h1 text: <h1>Glimmering Spikey Clouds (Drag to Rotate)</h1> -->
    <canvas id="threeCanvas"></canvas>
    <div id="info">Use your mouse or touch to rotate the view.</div>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Three.js Setup ---
        let scene, camera, renderer, controls;
        let clouds = []; // Array to hold our spikey cloud meshes
        let uniforms = {
            time: { value: 0.0 },
            baseColor: { value: new THREE.Color(0xADD8E6) }, // Light blue
            sparkleIntensity: { value: 0.5 }, // How strong the glimmer is
            fresnelPower: { value: 2.0 }, // Control fresnel intensity
            fresnelColor: { value: new THREE.Color(0x00FFFF) } // Cyan for fresnel effect
        };

        const NUM_CLOUDS = 8; // Number of spikey clouds to create

        // Vertex Shader for vertex displacement and passing variables to fragment shader
        const vertexShader = `
            uniform float time;
            varying vec3 vNormal;
            varying vec3 vViewDirection;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 modelViewPosition = modelViewMatrix * vec4(position, 1.0);
                vViewDirection = normalize(-modelViewPosition.xyz);

                // Simple time-based displacement for spikes (can be replaced with noise for more complex spikes)
                // Displace vertices along their normals to create a "spikey" effect
                float displacement = sin(position.y * 5.0 + time * 0.5) * 0.5 + sin(position.x * 5.0 + time * 0.7) * 0.5;
                displacement = clamp(displacement, -0.5, 0.5); // Keep displacement within reasonable bounds
                vec3 newPosition = position + normal * displacement * 2.0; // Scale displacement for more pronounced spikes

                gl_Position = projectionMatrix * modelViewPosition * vec4(newPosition, 1.0);
            }
        `;

        // Fragment Shader for glimmering effect and color
        const fragmentShader = `
            uniform float time;
            uniform vec3 baseColor;
            uniform float sparkleIntensity;
            uniform float fresnelPower;
            uniform vec3 fresnelColor;

            varying vec3 vNormal;
            varying vec3 vViewDirection;

            void main() {
                // Basic ambient lighting (adjust as needed)
                vec3 ambientColor = vec3(0.1, 0.1, 0.1);

                // Glimmering effect: modulate emissive light with sine wave based on time
                float glimmer = sin(time * 5.0) * 0.5 + 0.5; // Pulsates from 0.0 to 1.0
                vec3 emissive = baseColor * glimmer * sparkleIntensity;

                // Fresnel effect for edge glimmer
                float fresnel = dot(vNormal, vViewDirection);
                fresnel = pow(1.0 - abs(fresnel), fresnelPower); // Power controls sharpness
                vec3 finalFresnelColor = fresnelColor * fresnel;

                // Combine colors
                vec3 finalColor = baseColor + emissive + finalFresnelColor;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // Black background

            // 2. Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 45; // Zoomed out camera position
            camera.position.y = 5; // Slightly elevated to see more of the distributed clouds

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('threeCanvas') });
            renderer.setSize(window.innerWidth, window.innerHeight); // Occupy full screen
            renderer.setPixelRatio(window.devicePixelRatio); // Handle high-DPI screens

            // 4. OrbitControls for user interaction
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // For smoother camera movement
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // Prevent panning across the screen

            // 5. Lighting (optional if using pure ShaderMaterial, but good for general scene)
            const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100); // White point light
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Create multiple spikey clouds
            for (let i = 0; i < NUM_CLOUDS; i++) {
                createSpikeyCloud();
            }

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);

            // Start the animation loop
            animate();
        }

        function createSpikeyCloud() {
            // Base geometry (e.g., SphereGeometry or IcosahedronGeometry)
            const geometry = new THREE.SphereGeometry(Math.random() * 3 + 3, 32, 32); // Random size, 32 segments

            // Custom ShaderMaterial
            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true, // Allow transparency for cloud-like feel
                opacity: 0.9,
                side: THREE.DoubleSide // Render both sides of the faces
            });

            // Create the mesh
            const cloud = new THREE.Mesh(geometry, material);

            // Position the cloud randomly in a volume
            cloud.position.x = (Math.random() - 0.5) * 40; // Increased spread
            cloud.position.y = (Math.random() - 0.5) * 40;
            cloud.position.z = (Math.random() - 0.5) * 40;

            // Random initial rotation
            cloud.rotation.x = Math.random() * Math.PI;
            cloud.rotation.y = Math.random() * Math.PI;
            cloud.rotation.z = Math.random() * Math.PI;

            scene.add(cloud);
            clouds.push(cloud); // Add to our array for animation
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update uniforms for the shader animation
            uniforms.time.value += 0.01;

            // Rotate clouds slowly
            clouds.forEach(cloud => {
                cloud.rotation.x += 0.001;
                cloud.rotation.y += 0.002;
            });

            controls.update(); // Only required if controls.enableDamping or controls.autoRotate are set to true
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            // Update camera aspect ratio to full window size
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            // Update renderer size to full window size
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the Three.js scene once the window is loaded
        window.onload = init;

    </script>
</body>
</html>
