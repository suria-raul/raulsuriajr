<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gather Disperse</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center,
                        #1a0a2a 0%, /* Dark purple/blue center */
                        #000005 50%, /* Very dark blue */
                        #000000 100% /* Black outer */
                      ),
                      radial-gradient(circle at top left, rgba(255, 255, 255, 0.05) 0%, transparent 20%),
                      radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.03) 0%, transparent 15%);
            background-size: 200% 200%, 100% 100%, 100% 100%;
            animation: galaxyShimmer 30s infinite alternate linear;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }

        @keyframes galaxyShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #info {
                font-size: 0.75em;
                padding: 5px 10px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="threeCanvas"></canvas>
    <div id="info">Use mouse (drag/scroll) or touch (drag/pinch) to navigate.</div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Three.js Global Variables ---
        let scene, camera, renderer, controls;
        let instancedButterflies;
        const tempObject = new THREE.Object3D(); // Helper for InstancedMesh transforms
        const tempColor = new THREE.Color();    // Helper for InstancedMesh colors

        // --- Animation State ---
        const NUM_BUTTERFLIES = 50000; // You can adjust this number. "Millions" is usually not feasible in real-time browser 3D without GPGPU or very advanced techniques.
        const SCATTER_RADIUS = 100;    // How far dispersed butterflies spread
        const FORMATION_DURATION = 4; // Seconds to form/disperse
        const FORMED_STATE_DURATION = 3; // Seconds to stay in giant butterfly form

        let animationState = 'SCATTERED'; // SCATTERED, FORMING, FORMED, DISPERSING
        let stateStartTime = 0; // Timestamp when current state began

        const particleData = []; // Stores { initialPos, targetPos, currentPos, color } for each butterfly

        // --- Initialization Function ---
        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = null; // Let CSS handle the background

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 150); // Zoomed out to see the whole transformation

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('threeCanvas'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // 4. OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 50; // Prevent zooming too close
            controls.maxDistance = 250; // Limit zooming out

            // 5. Lighting (for the overall scene, affects standard materials)
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white ambient light
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            // --- Create the Instanced Butterflies ---
            // Simple geometry for each "butterfly" (a small, thin box to represent a part of a wing)
            const butterflyGeometry = new THREE.BoxGeometry(1, 0.1, 0.5); // Very thin
            const butterflyMaterial = new THREE.MeshPhongMaterial({ flatShading: true }); // Allows for varied colors

            instancedButterflies = new THREE.InstancedMesh(butterflyGeometry, butterflyMaterial, NUM_BUTTERFLIES);
            instancedButterflies.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // Allow frequent updates

            // Initialize particle data with random scattered positions
            for (let i = 0; i < NUM_BUTTERFLIES; i++) {
                const initialPos = new THREE.Vector3(
                    THREE.MathUtils.randFloatSpread(SCATTER_RADIUS), // Random x within scatter radius
                    THREE.MathUtils.randFloatSpread(SCATTER_RADIUS), // Random y
                    THREE.MathUtils.randFloatSpread(SCATTER_RADIUS)  // Random z
                );
                // Assign a target position (will be updated when forming the giant butterfly)
                const targetPos = new THREE.Vector3().copy(initialPos);
                const currentPos = new THREE.Vector3().copy(initialPos);

                // Random color for each butterfly
                const color = new THREE.Color(Math.random() * 0xffffff);

                particleData.push({
                    initialPos: initialPos,
                    targetPos: targetPos,
                    currentPos: currentPos,
                    color: color,
                    // Store target for giant butterfly form (will be generated next)
                    giantButterflyTarget: new THREE.Vector3()
                });
            }

            scene.add(instancedButterflies);

            // Generate target positions for the giant butterfly form
            generateGiantButterflyForm();

            // Set initial state time
            stateStartTime = performance.now();

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);

            // Start the animation loop
            animate();
        }

        // --- Generate points for the giant butterfly shape ---
        function generateGiantButterflyForm() {
            // A simplified procedural butterfly shape: two main wings and a body
            const wingWidth = 60;
            const wingHeight = 40;
            const bodyLength = 30;
            const bodyRadius = 5;

            let particleIndex = 0;

            // Generate points for the left wing (approx half of butterflies)
            const numWingParticles = Math.floor(NUM_BUTTERFLIES * 0.45); // 45% for left wing
            for (let i = 0; i < numWingParticles; i++) {
                if (particleIndex >= NUM_BUTTERFLIES) break;

                const u = Math.random() * Math.PI; // Angle for semi-circle like shape
                const v = Math.random() * 2 - 1; // Vertical position (-1 to 1)

                // Simple parametric shape for a wing (oval-like)
                const x = -wingWidth * Math.sin(u) * (1 - Math.abs(v * 0.5));
                const y = wingHeight * v * (0.8 + 0.2 * Math.sin(u * 2));
                const z = (Math.random() - 0.5) * 5; // Slight depth

                particleData[particleIndex].giantButterflyTarget.set(x, y, z);
                particleIndex++;
            }

            // Generate points for the right wing (approx half of butterflies)
            const numRightWingParticles = Math.floor(NUM_BUTTERFLIES * 0.45); // 45% for right wing
            for (let i = 0; i < numRightWingParticles; i++) {
                if (particleIndex >= NUM_BUTTERFLIES) break;

                const u = Math.random() * Math.PI; // Angle for semi-circle like shape
                const v = Math.random() * 2 - 1; // Vertical position (-1 to 1)

                const x = wingWidth * Math.sin(u) * (1 - Math.abs(v * 0.5));
                const y = wingHeight * v * (0.8 + 0.2 * Math.sin(u * 2));
                const z = (Math.random() - 0.5) * 5; // Slight depth

                particleData[particleIndex].giantButterflyTarget.set(x, y, z);
                particleIndex++;
            }

            // Generate points for the body (remaining particles)
            while (particleIndex < NUM_BUTTERFLIES) {
                const x = THREE.MathUtils.randFloatSpread(bodyRadius);
                const y = THREE.MathUtils.randFloatSpread(bodyRadius) + (Math.random() - 0.5) * bodyLength;
                const z = THREE.MathUtils.randFloatSpread(bodyRadius);

                particleData[particleIndex].giantButterflyTarget.set(x, y, z);
                particleIndex++;
            }

            // Shuffle target positions to avoid predictable formation lines
            shuffleArray(particleData.map(p => p.giantButterflyTarget));
        }

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
        }


        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            controls.update(); // Update orbit controls

            const currentTime = performance.now();
            const elapsedSinceStateChange = (currentTime - stateStartTime) / 1000; // in seconds

            let progress = 0;

            switch (animationState) {
                case 'SCATTERED':
                    // Stay scattered for a moment before forming
                    if (elapsedSinceStateChange > 2) { // Wait 2 seconds in scattered state
                        animationState = 'FORMING';
                        stateStartTime = currentTime;
                    }
                    progress = 0; // Always start from 0 for scattered phase
                    break;
                case 'FORMING':
                    progress = Math.min(1, elapsedSinceStateChange / FORMATION_DURATION);
                    if (progress === 1) {
                        animationState = 'FORMED';
                        stateStartTime = currentTime;
                    }
                    break;
                case 'FORMED':
                    if (elapsedSinceStateChange > FORMED_STATE_DURATION) {
                        animationState = 'DISPERSING';
                        stateStartTime = currentTime;
                    }
                    progress = 1; // Maintain formed state
                    break;
                case 'DISPERSING':
                    progress = Math.max(0, 1 - (elapsedSinceStateChange / FORMATION_DURATION));
                    if (progress === 0) {
                        animationState = 'SCATTERED';
                        stateStartTime = currentTime;
                    }
                    break;
            }

            // Update instance matrices based on current state and progress
            for (let i = 0; i < NUM_BUTTERFLIES; i++) {
                const p = particleData[i];

                if (animationState === 'SCATTERED' || animationState === 'DISPERSING') {
                    // Interpolate from giant butterfly target to scattered initial position
                    p.currentPos.lerpVectors(p.giantButterflyTarget, p.initialPos, 1 - progress);
                } else if (animationState === 'FORMING' || animationState === 'FORMED') {
                    // Interpolate from scattered initial position to giant butterfly target
                    p.currentPos.lerpVectors(p.initialPos, p.giantButterflyTarget, progress);
                }

                tempObject.position.copy(p.currentPos);
                tempObject.rotation.set(
                    Math.sin(currentTime * 0.001 + i) * 0.5, // Subtle flutter rotation
                    Math.cos(currentTime * 0.0008 + i) * 0.5,
                    0
                );
                // Scale down slightly when dispersed for a more particle-like feel
                const scaleFactor = animationState === 'SCATTERED' ? 0.5 : 1.0;
                tempObject.scale.set(scaleFactor, scaleFactor, scaleFactor);

                tempObject.updateMatrix();
                instancedButterflies.setMatrixAt(i, tempObject.matrix);
                instancedButterflies.setColorAt(i, p.color);
            }

            instancedButterflies.instanceMatrix.needsUpdate = true;
            instancedButterflies.instanceColor.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // --- Handle Window Resizing ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the scene when the window loads
        window.onload = init;
    </script>
</body>
</html>
