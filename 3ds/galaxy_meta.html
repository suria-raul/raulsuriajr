<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Way Galaxy</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let scene, camera, renderer;

        function init() {
            // Create the scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Create the camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 500;

            // Create the renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('canvas'),
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Create the galaxy
            createGalaxy();

            // Add event listener for window resize
            window.addEventListener('resize', onWindowResize, false);

            // Animate the scene
            animate();
        }

        function createGalaxy() {
            // Create the galactic disk
            const diskGeometry = new THREE.TorusGeometry(200, 10, 2, 100);
            const diskMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.5, transparent: true });
            const disk = new THREE.Mesh(diskGeometry, diskMaterial);
            disk.rotation.x = Math.PI / 2;
            scene.add(disk);

            // Create the central bulge
            const bulgeGeometry = new THREE.SphereGeometry(50, 32, 32);
            const bulgeMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bulge = new THREE.Mesh(bulgeGeometry, bulgeMaterial);
            scene.add(bulge);

            // Create stars
            for (let i = 0; i < 1000; i++) {
                const starGeometry = new THREE.SphereGeometry(1, 16, 16);
                const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const star = new THREE.Mesh(starGeometry, starMaterial);
                star.position.x = Math.random() * 400 - 200;
                star.position.y = Math.random() * 400 - 200;
                star.position.z = Math.random() * 400 - 200;
                scene.add(star);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            camera.rotation.z += 0.001;
            renderer.render(scene, camera);
        }

        // Load Three.js library
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        document.head.appendChild(script);

        // Wait for the library to load
        script.onload = function() {
            init();
        };
    </script>
</body>
</html>
